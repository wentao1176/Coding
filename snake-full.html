<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏 - 全屏模式</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            height: 100vh;
            width: 100vw;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .title {
            font-size: 3rem;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .game-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .control-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .control-label {
            font-weight: 600;
            color: white;
            font-size: 1.1rem;
        }
        .control-value {
            font-size: 1.5rem;
            font-weight: 900;
            color: white;
        }
        .control-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .difficulty-btn {
            padding: 8px 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .difficulty-btn:hover {
            border-color: white;
            background: rgba(255, 255, 255, 0.2);
        }
        .difficulty-btn.active {
            background: rgba(255, 255, 255, 0.3);
            border-color: white;
        }
        .reset-btn {
            padding: 10px 20px;
            background: linear-gradient(45deg, #f06292, #ec407a);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(240, 98, 146, 0.3);
        }
        .game-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .game-board {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            position: relative;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(20, 30px);
            grid-template-rows: repeat(20, 30px);
        }
        .cell {
            width: 30px;
            height: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .cell.snake {
            background: linear-gradient(45deg, #4caf50, #45a049);
            border-color: rgba(255, 255, 255, 0.4);
        }
        .cell.food {
            background: linear-gradient(45deg, #f44336, #d32f2f);
            border-radius: 50%;
            border-color: rgba(255, 255, 255, 0.4);
        }
        .cell.snake-head {
            background: linear-gradient(45deg, #2e7d32, #1b5e20);
            border-radius: 50%;
        }
        .game-status {
            text-align: center;
            margin-top: 20px;
            padding: 20px;
            border-radius: 15px;
            font-size: 1.3rem;
            font-weight: 600;
            display: none;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        .game-status.win {
            color: #81c784;
        }
        .game-status.lose {
            color: #ef5350;
        }
        .joystick-container {
            position: fixed;
            bottom: 30px;
            left: 30px;
            display: none;
            z-index: 1000;
        }
        .joystick {
            width: 120px;
            height: 120px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            position: relative;
            backdrop-filter: blur(10px);
        }
        .joystick-knob {
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            touch-action: none;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.1s ease;
        }
        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
        }
        .back-link a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: color 0.3s ease;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .back-link a:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        @media (max-width: 768px) {
            .title {
                font-size: 2rem;
            }
            .game-controls {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            .control-item, .control-group {
                justify-content: center;
            }
            .game-grid {
                grid-template-columns: repeat(20, 25px);
                grid-template-rows: repeat(20, 25px);
            }
            .cell {
                width: 25px;
                height: 25px;
            }
            .joystick-container {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="back-link">
        <a href="snake.html">返回游戏选择</a>
    </div>
    
    <div class="container">
        <div class="header">
            <h1 class="title">贪吃蛇游戏</h1>
        </div>
        
        <div class="game-controls">
            <div class="control-item">
                <span class="control-label">分数:</span>
                <span class="control-value" id="score">0</span>
            </div>
            <div class="control-group">
                <button class="difficulty-btn active" data-speed="150">简单</button>
                <button class="difficulty-btn" data-speed="100">中等</button>
                <button class="difficulty-btn" data-speed="70">困难</button>
            </div>
            <button class="reset-btn" onclick="resetGame()">重新开始</button>
        </div>
        
        <div class="game-container">
            <div class="game-board">
                <div class="game-grid" id="game-grid"></div>
            </div>
        </div>
        
        <div class="game-status" id="game-status"></div>
    </div>
    
    <!-- 虚拟摇杆 -->
    <div class="joystick-container">
        <div class="joystick" id="joystick">
            <div class="joystick-knob" id="joystick-knob"></div>
        </div>
    </div>

    <script>
        let game = null;
        let gameInterval = null;
        let currentSpeed = 150;
        
        class SnakeGame {
            constructor() {
                this.gridSize = 20;
                this.cellSize = 30;
                this.snake = [{ x: 10, y: 10 }];
                this.direction = 'right';
                this.food = this.generateFood();
                this.score = 0;
                this.gameOver = false;
                
                this.initGame();
                this.render();
            }
            
            initGame() {
                const grid = document.getElementById('game-grid');
                grid.innerHTML = '';
                
                for (let y = 0; y < this.gridSize; y++) {
                    for (let x = 0; x < this.gridSize; x++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.dataset.x = x;
                        cell.dataset.y = y;
                        grid.appendChild(cell);
                    }
                }
                
                document.getElementById('score').textContent = '0';
                document.getElementById('game-status').style.display = 'none';
            }
            
            generateFood() {
                let food;
                do {
                    food = {
                        x: Math.floor(Math.random() * this.gridSize),
                        y: Math.floor(Math.random() * this.gridSize)
                    };
                } while (this.snake.some(segment => segment.x === food.x && segment.y === food.y));
                
                return food;
            }
            
            move() {
                const head = { ...this.snake[0] };
                
                switch (this.direction) {
                    case 'up':
                        head.y--;
                        break;
                    case 'down':
                        head.y++;
                        break;
                    case 'left':
                        head.x--;
                        break;
                    case 'right':
                        head.x++;
                        break;
                }
                
                if (this.checkCollision(head)) {
                    this.gameOver = true;
                    this.gameOverHandler();
                    return;
                }
                
                this.snake.unshift(head);
                
                if (head.x === this.food.x && head.y === this.food.y) {
                    this.score += 10;
                    document.getElementById('score').textContent = this.score;
                    this.food = this.generateFood();
                } else {
                    this.snake.pop();
                }
                
                this.render();
            }
            
            checkCollision(head) {
                if (head.x < 0 || head.x >= this.gridSize || head.y < 0 || head.y >= this.gridSize) {
                    return true;
                }
                
                for (let i = 1; i < this.snake.length; i++) {
                    if (head.x === this.snake[i].x && head.y === this.snake[i].y) {
                        return true;
                    }
                }
                
                return false;
            }
            
            render() {
                document.querySelectorAll('.cell').forEach(cell => {
                    cell.className = 'cell';
                });
                
                this.snake.forEach((segment, index) => {
                    const cell = document.querySelector(`[data-x="${segment.x}"][data-y="${segment.y}"]`);
                    if (cell) {
                        cell.className = index === 0 ? 'cell snake snake-head' : 'cell snake';
                    }
                });
                
                const foodCell = document.querySelector(`[data-x="${this.food.x}"][data-y="${this.food.y}"]`);
                if (foodCell) {
                    foodCell.className = 'cell food';
                }
            }
            
            changeDirection(newDirection) {
                const oppositeDirections = {
                    'up': 'down',
                    'down': 'up',
                    'left': 'right',
                    'right': 'left'
                };
                
                if (newDirection !== oppositeDirections[this.direction]) {
                    this.direction = newDirection;
                }
            }
            
            gameOverHandler() {
                stopGame();
                const statusElement = document.getElementById('game-status');
                statusElement.textContent = `游戏结束！最终得分：${this.score}`;
                statusElement.className = 'game-status lose';
                statusElement.style.display = 'block';
            }
        }
        
        function startGame() {
            stopGame();
            game = new SnakeGame();
            gameInterval = setInterval(() => {
                if (game && !game.gameOver) {
                    game.move();
                }
            }, currentSpeed);
        }
        
        function stopGame() {
            if (gameInterval) {
                clearInterval(gameInterval);
                gameInterval = null;
            }
        }
        
        function resetGame() {
            startGame();
        }
        
        document.addEventListener('keydown', (e) => {
            if (!game || game.gameOver) return;
            
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    e.preventDefault();
                    game.changeDirection('up');
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    e.preventDefault();
                    game.changeDirection('down');
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    e.preventDefault();
                    game.changeDirection('left');
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    e.preventDefault();
                    game.changeDirection('right');
                    break;
            }
        });
        
        function initJoystick() {
            const joystick = document.getElementById('joystick');
            const knob = document.getElementById('joystick-knob');
            const joystickRect = joystick.getBoundingClientRect();
            const radius = joystickRect.width / 2;
            let isDragging = false;
            let lastDirection = '';
            
            function getDirection(dx, dy) {
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance< 15) return '';
                
                const angle = Math.atan2(dy, dx) * (180 / Math.PI);
                
                if (angle >-45 && angle<= 45) return 'right';
                if (angle >45 && angle<= 135) return 'down';
                if (angle >135 || angle <= -135) return 'left';
                if (angle >-135 && angle <= -45) return 'up';
                
                return '';
            }
            
            function updateKnobPosition(clientX, clientY) {
                const centerX = joystickRect.left + radius;
                const centerY = joystickRect.top + radius;
                
                let dx = clientX - centerX;
                let dy = clientY - centerY;
                
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance > radius) {
                    const ratio = radius / distance;
                    dx *= ratio;
                    dy *= ratio;
                }
                
                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                
                const direction = getDirection(dx, dy);
                if (direction && direction !== lastDirection && game && !game.gameOver) {
                    game.changeDirection(direction);
                    lastDirection = direction;
                }
            }
            
            function resetKnob() {
                knob.style.transform = 'translate(-50%, -50%)';
                isDragging = false;
                lastDirection = '';
            }
            
            knob.addEventListener('mousedown', (e) => {
                e.preventDefault();
                isDragging = true;
            });
            
            knob.addEventListener('touchstart', (e) => {
                e.preventDefault();
                isDragging = true;
            });
            
            document.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    updateKnobPosition(e.clientX, e.clientY);
                }
            });
            
            document.addEventListener('touchmove', (e) => {
                if (isDragging && e.touches.length > 0) {
                    updateKnobPosition(e.touches[0].clientX, e.touches[0].clientY);
                }
            });
            
            document.addEventListener('mouseup', resetKnob);
            document.addEventListener('touchend', resetKnob);
        }
        
        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentSpeed = parseInt(this.dataset.speed);
                if (game) {
                    stopGame();
                    startGame();
                }
            });
        });
        
        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const level = urlParams.get('level') || 'easy';
            
            // 设置难度
            switch (level) {
                case 'easy':
                    currentSpeed = 150;
                    break;
                case 'medium':
                    currentSpeed = 100;
                    break;
                case 'hard':
                    currentSpeed = 70;
                    break;
                default:
                    currentSpeed = 150;
            }
            
            // 更新按钮状态
            document.querySelectorAll('.difficulty-btn').forEach(btn => {
                btn.classList.remove('active');
                if (parseInt(btn.dataset.speed) === currentSpeed) {
                    btn.classList.add('active');
                }
            });
            
            startGame();
            initJoystick();
        });
    </script>
</body>
</html>
