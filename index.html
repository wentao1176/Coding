<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宣文韬最帅</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        /* 页面样式：全屏居中，炫酷文字 */
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Microsoft YaHei", sans-serif;
        }
        /* 核心文字样式：超大号、渐变色彩、发光效果 */
        .title {
            font-size: 80px;
            font-weight: bold;
            background: linear-gradient(45deg, #ff6b9d, #ffd93d, #61dafb, #ff6b9d);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 3s ease infinite, glow 2s ease-in-out infinite alternate;
            z-index: 10;
            position: relative;
            text-shadow: 0 0 20px rgba(255, 107, 157, 0.5);
        }
        /* 渐变动画 */
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        /* 发光动画 */
        @keyframes glow {
            from { filter: brightness(1); }
            to { filter: brightness(1.3); }
        }
        /* 烟花画布全屏覆盖 */
        #fireworks {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>
    <!-- 烟花画布 -->
    <canvas id="fireworks"></canvas>
    <!-- 核心文字 -->
    <h1 class="title">宣文韬最帅</h1>

    <script>
        // 烟花特效核心代码
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // 随机数函数
        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        // 粒子类（烟花粒子）
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.speed = random(2, 6);
                this.angle = random(0, Math.PI * 2);
                this.gravity = 0.05;
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;
                this.alpha = 1;
                this.decay = random(0.005, 0.01);
                this.color = color;
            }
            update() {
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        let particles = [];
        // 烟花颜色库
        const colors = ['#ff6b9d', '#ffd93d', '#61dafb', '#ff9f1c', '#7B2CBF', '#51d660'];

        // 创建烟花
        function createFirework() {
            const x = random(50, canvas.width - 50);
            const y = random(50, canvas.height / 2);
            const color = colors[Math.floor(random(0, colors.length))];
            
            // 生成大量粒子
            for (let i = 0; i < 100; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        // 自动循环放烟花
        setInterval(createFirework, 800);

        // 渲染动画
        function animate() {
            // 半透明轨迹效果
            ctx.fillStyle = 'rgba(10, 10, 10, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 更新并绘制所有粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                
                // 移除透明粒子
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
            requestAnimationFrame(animate);
        }

        // 窗口大小自适应
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // 启动动画
        animate();
    </script>
</body>
</html>
