<!DOCTYPE html>
<title>首页</title>
<body>
  <h1>你已登录成功</h1>
  <p id="msg">正在验证登录状态...</p>
  <button onclick="logout()">退出登录</button>

  <script>
    async function checkLogin() {
      let token = localStorage.token;
      if (!token) {
        alert("请先登录");
        location.href = "login.html";
        return;
      }

      let res = await fetch(`/check?token=${token}`);
      if (res.ok) {
        let data = await res.json();
        document.getElementById("msg").innerText = "欢迎你：" + data.username;
      } else {
        alert("登录已过期，请重新登录");
        localStorage.removeItem("token");
        location.href = "login.html";
      }
    }

    function logout() {
      localStorage.removeItem("token");
      location.href = "login.html";
    }

    checkLogin();
  </script>
</body>
</html>
