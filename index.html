<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>!(^O^)y</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }
        #fireworks {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .user-info {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            z-index: 100;
            text-align: right;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            animation: slideInRight 0.6s ease-out;
        }
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        .user-info p {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        .user-info button {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        .user-info button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        .user-info button:active {
            transform: translateY(0);
        }
        .main-content {
            text-align: center;
            z-index: 10;
            animation: fadeInUp 1s ease-out;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .title {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 900;
            background: linear-gradient(45deg, #ff6b9d, #ffd93d, #61dafb, #7B2CBF, #51d660);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 4s ease infinite, glow 2s ease-in-out infinite alternate, float 6s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(255, 107, 157, 0.3);
            line-height: 1.2;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes glow {
            from { filter: brightness(1) drop-shadow(0 0 20px rgba(255, 107, 157, 0.3)); }
            to { filter: brightness(1.3) drop-shadow(0 0 40px rgba(255, 107, 157, 0.5)); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-30px); }
        }
        .subtitle {
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 50px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            font-weight: 300;
            letter-spacing: 3px;
            animation: fadeIn 2s ease-out 0.5s both;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .games-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            max-width: 600px;
            margin: 0 auto;
            animation: fadeInUp 1s ease-out 1s both;
        }
        .game-button {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 25px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            text-align: center;
            cursor: pointer;
            transition: all 0.4s ease;
            min-width: 200px;
        }
        .game-button:hover {
            transform: translateY(-10px) scale(1.05);
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }
        .game-button:active {
            transform: translateY(-5px) scale(1.02);
        }
        .game-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
        }
        .game-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
        }
        .game-desc {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
        }
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            z-index: 1000;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            font-size: 1.1rem;
            color: #333;
            font-weight: 600;
        }
        @media (max-width: 768px) {
            .user-info {
                top: 10px;
                right: 10px;
                left: 10px;
                padding: 12px 15px;
            }
            .title {
                font-size: 4rem;
                margin-bottom: 20px;
            }
            .subtitle {
                font-size: 1.2rem;
                margin-bottom: 30px;
            }
            .stats {
                gap: 20px;
            }
            .stat-item {
                padding: 15px 30px;
            }
            .stat-number {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <canvas id="fireworks"></canvas>
    
    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">正在验证登录状态...</div>
    </div>
    
    <div class="user-info" id="user-info" style="display: none;">
        <p id="welcome-msg"></p>
        <button onclick="logout()">退出登录</button>
    </div>
    
    <div class="main-content" id="main-content" style="display: none;">
        <h1 class="title">
            宣文韬<br>
            最帅
        </h1>
        <p class="subtitle">欢迎!</p>
        <div class="games-container">
            <div class="game-button" onclick="startMinesweeper()">
                <span class="game-icon">💣</span>
                <div class="game-title">扫雷游戏</div>
                <div class="game-desc">点击进入全屏游戏</div>
            </div>
            <div class="game-button" onclick="startSnakeGame()">
                <span class="game-icon">🐍</span>
                <div class="game-title">贪吃蛇游戏</div>
                <div class="game-desc">点击进入全屏游戏</div>
            </div>
        </div>
    </div>

    <script>
        // 登录验证
        async function checkLogin() {
            const token = localStorage.token;
            if (!token) {
                alert("请先登录");
                location.href = "login.html";
                return;
            }

            try {
            const res = await fetch(`/api/check?token=${token}`);
            if (res.ok) {
                const data = await res.json();
                document.getElementById("welcome-msg").innerText = `欢迎你：${data.username}`;
                document.getElementById("loading").style.display = 'none';
                document.getElementById("user-info").style.display = 'block';
                document.getElementById("main-content").style.display = 'block';
                // 登录成功，启动烟花特效
                startFireworks();
            } else {
                alert("登录已过期，请重新登录");
                localStorage.removeItem("token");
                location.href = "login.html";
            }
        } catch (error) {
            alert("网络错误，请稍后重试");
            console.error('登录验证错误:', error);
            document.getElementById("loading").style.display = 'none';
        }
        }

        // 开始扫雷游戏
        function startMinesweeper() {
            // 跳转到扫雷游戏页面
            location.href = "minesweeper.html";
        }
        
        // 开始贪吃蛇游戏
        function startSnakeGame() {
            // 跳转到贪吃蛇游戏页面
            location.href = "snake.html";
        }

        function logout() {
            if (confirm("确定要退出登录吗？")) {
                localStorage.removeItem("token");
                location.href = "login.html";
            }
        }

        // 烟花特效
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        let fireworksInterval;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.speed = random(3, 8);
                this.angle = random(0, Math.PI * 2);
                this.gravity = 0.1;
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;
                this.alpha = 1;
                this.decay = random(0.008, 0.015);
                this.color = color;
                this.size = random(2, 4);
            }
            update() {
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        let particles = [];
        const colors = ['#ff6b9d', '#ffd93d', '#61dafb', '#ff9f1c', '#7B2CBF', '#51d660', '#ff3366', '#33ccff'];

        function createFirework() {
            const x = random(50, canvas.width - 50);
            const y = random(50, canvas.height / 2);
            const color = colors[Math.floor(random(0, colors.length))];
            
            for (let i = 0; i < 150; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(102, 126, 234, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
            requestAnimationFrame(animate);
        }

        // 启动烟花
        function startFireworks() {
            animate();
            fireworksInterval = setInterval(createFirework, 1000);
        }

        // 页面加载后执行登录验证
        checkLogin();
    </script>
</body>
</html>
