<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: "Microsoft YaHei", sans-serif;
        }
        .user-info {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            z-index: 100;
            text-align: right;
        }
        .user-info button {
            margin-top: 10px;
            padding: 8px 16px;
            background: linear-gradient(45deg, #ff6b9d, #61dafb);
            border: none;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.3s;
        }
        .user-info button:hover {
            transform: scale(1.1);
        }
        .title {
            font-size: 80px;
            font-weight: bold;
            background: linear-gradient(45deg, #ff6b9d, #ffd93d, #61dafb, #ff6b9d);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 3s ease infinite, glow 2s ease-in-out infinite alternate, float 3s ease-in-out infinite;
            z-index: 10;
            position: relative;
            text-shadow: 0 0 20px rgba(255, 107, 157, 0.5);
            text-align: center;
            line-height: 1.3;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes glow {
            from { filter: brightness(1); }
            to { filter: brightness(1.3); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        #fireworks {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>
    <canvas id="fireworks"></canvas>
    
    <div class="user-info">
        <p id="msg">正在验证登录状态...</p>
        <button onclick="logout()">退出登录</button>
    </div>
    
    <h1 class="title">
        宣文韬<br>
        最帅
    </h1>

    <script>
        // 登录验证
        async function checkLogin() {
            let token = localStorage.token;
            if (!token) {
                alert("请先登录");
                location.href = "login.html";
                return;
            }

            let res = await fetch(`/api/check?token=${token}`);
            if (res.ok) {
                let data = await res.json();
                document.getElementById("msg").innerText = "欢迎你：" + data.username;
                // 登录成功，启动烟花特效
                startFireworks();
            } else {
                alert("登录已过期，请重新登录");
                localStorage.removeItem("token");
                location.href = "login.html";
            }
        }

        function logout() {
            localStorage.removeItem("token");
            location.href = "login.html";
        }

        // 烟花特效
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        let fireworksInterval;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.speed = random(2, 6);
                this.angle = random(0, Math.PI * 2);
                this.gravity = 0.05;
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;
                this.alpha = 1;
                this.decay = random(0.005, 0.01);
                this.color = color;
            }
            update() {
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        let particles = [];
        const colors = ['#ff6b9d', '#ffd93d', '#61dafb', '#ff9f1c', '#7B2CBF', '#51d660'];

        function createFirework() {
            const x = random(50, canvas.width - 50);
            const y = random(50, canvas.height / 2);
            const color = colors[Math.floor(random(0, colors.length))];
            
            for (let i = 0; i < 100; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(10, 10, 10, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
            requestAnimationFrame(animate);
        }

        // 启动烟花
        function startFireworks() {
            animate();
            fireworksInterval = setInterval(createFirework, 800);
        }

        // 页面加载后执行登录验证
        checkLogin();
    </script>
</body>
</html>
