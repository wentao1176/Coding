<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>请输入密码</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Microsoft YaHei", sans-serif;
        }
        /* 文字默认隐藏 */
        .title {
            font-size: 50px;
            font-weight: bold;
            background: linear-gradient(45deg, #ff6b9d, #ffd93d, #61dafb, #ff6b9d);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 3s ease infinite, glow 2s ease-in-out infinite alternate;
            z-index: 10;
            position: relative;
            text-shadow: 0 0 20px rgba(255, 107, 157, 0.5);
            text-align: center;
            line-height: 1.3;
            display: none; /* 默认隐藏 */
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes glow {
            from { filter: brightness(1); }
            to { filter: brightness(1.3); }
        }
        #fireworks {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>
    <canvas id="fireworks"></canvas>
    <h1 class="title">
        宣文韬<br>
        最帅
    </h1>

    <script>
        // ====================== 口令设置 ======================
        const PASSWORD = "111"; // 你可以改成自己想要的口令
        // ======================================================

        // 口令验证
        function checkPassword() {
            let userInput = prompt("请输入正确密码：", "");
            if (userInput === PASSWORD) {
                // 验证成功：显示文字 + 启动烟花
                document.querySelector(".title").style.display = "block";
                startFireworks();
                document.title = "啦啦啦啦啦啦";
            } else {
                alert("口令错误，无法查看内容！");
                checkPassword(); // 错误则重新输入
            }
        }

        // 烟花特效（验证成功才启动）
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        let fireworksInterval;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.speed = random(2, 6);
                this.angle = random(0, Math.PI * 2);
                this.gravity = 0.05;
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;
                this.alpha = 1;
                this.decay = random(0.005, 0.01);
                this.color = color;
            }
            update() {
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        let particles = [];
        const colors = ['#ff6b9d', '#ffd93d', '#61dafb', '#ff9f1c', '#7B2CBF', '#51d660'];

        function createFirework() {
            const x = random(50, canvas.width - 50);
            const y = random(50, canvas.height / 2);
            const color = colors[Math.floor(random(0, colors.length))];
            
            for (let i = 0; i < 100; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(10, 10, 10, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
            requestAnimationFrame(animate);
        }

        // 启动烟花
        function startFireworks() {
            animate();
            fireworksInterval = setInterval(createFirework, 800);
        }

        // 页面加载后执行口令验证
        window.onload = checkPassword;
    </script>
</body>
</html>
