<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋游戏 - 宣文韬</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            animation: fadeInUp 0.6s ease-out;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .title {
            font-size: 2.5rem;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            font-size: 1.1rem;
        }
        .game-actions {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }
        .action-section {
            padding: 20px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 15px;
            border: 1px solid rgba(102, 126, 234, 0.2);
        }
        .action-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .action-btn {
            padding: 12px 24px;
            border: 2px solid #667eea;
            border-radius: 25px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        .room-input {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: center;
            align-items: center;
        }
        .room-input input {
            padding: 10px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 1rem;
            width: 200px;
        }
        .room-input button {
            padding: 10px 20px;
            border: 2px solid #667eea;
            border-radius: 8px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .room-input button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        .rooms-list {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
        }
        .room-item {
            padding: 12px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            border: 1px solid rgba(102, 126, 234, 0.3);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .room-info {
            flex: 1;
        }
        .room-id {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        .room-players {
            color: #666;
            font-size: 0.9rem;
        }
        .join-btn {
            padding: 8px 16px;
            border: 2px solid #667eea;
            border-radius: 20px;
            background: white;
            color: #667eea;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .join-btn:hover {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }
        .select-message {
            text-align: center;
            margin: 30px 0;
            padding: 20px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 15px;
            border: 1px solid rgba(102, 126, 234, 0.2);
            color: #666;
            font-size: 1.1rem;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: color 0.3s ease;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 25px;
            border: 1px solid rgba(102, 126, 234, 0.3);
        }
        .back-link a:hover {
            background: rgba(102, 126, 234, 0.1);
        }
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            .title {
                font-size: 2rem;
            }
            .action-buttons {
                flex-direction: column;
                align-items: center;
            }
            .room-input {
                flex-direction: column;
                align-items: center;
            }
            .room-input input {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">五子棋游戏</h1>
            <p class="subtitle">双人联机对战</p>
        </div>
        
        <div class="game-actions">
            <div class="action-section">
                <div class="action-title">创建房间</div>
                <div class="action-buttons">
                    <button class="action-btn" onclick="createRoom()">创建新房间</button>
                </div>
            </div>
            
            <div class="action-section">
                <div class="action-title">加入房间</div>
                <div class="room-input">
                    <input type="text" id="roomIdInput" placeholder="输入房间ID" maxlength="6">
                    <button onclick="joinRoom()">加入房间</button>
                </div>
            </div>
            
            <div class="action-section">
                <div class="action-title">可用房间</div>
                <div class="rooms-list" id="roomsList">
                    <p style="text-align: center; color: #666;">加载中...</p>
                </div>
            </div>
        </div>
        
        <div class="back-link">
            <a href="index.html">返回主页</a>
        </div>
    </div>

    <script>
        // 获取用户名
        function getUsername() {
            const token = localStorage.getItem('token');
            if (!token) {
                alert('请先登录');
                window.location.href = 'login.html';
                return null;
            }
            
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                return payload.username;
            } catch (e) {
                alert('登录状态无效，请重新登录');
                window.location.href = 'login.html';
                return null;
            }
        }
        
        // 创建房间
        function createRoom() {
            const username = getUsername();
            if (!username) return;
            
            // 生成随机房间ID
            const roomId = generateRoomId();
            joinGame(roomId, username);
        }
        
        // 加入房间
        function joinRoom() {
            const username = getUsername();
            if (!username) return;
            
            const roomId = document.getElementById('roomIdInput').value.trim().toUpperCase();
            if (!roomId) {
                alert('请输入房间ID');
                return;
            }
            
            joinGame(roomId, username);
        }
        
        // 加入游戏
        function joinGame(roomId, username) {
            window.location.href = `go-full.html?room=${roomId}&username=${encodeURIComponent(username)}`;
        }
        
        // 生成房间ID
        function generateRoomId() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let roomId = '';
            for (let i = 0; i< 6; i++) {
                roomId += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return roomId;
        }
        
        // 获取房间列表
        function fetchRooms() {
            fetch('/api/go/rooms')
                .then(response =>response.json())
                .then(data => {
                    const roomsList = document.getElementById('roomsList');
                    if (data.status === 'ok' && data.rooms.length > 0) {
                        roomsList.innerHTML = data.rooms.map(room => `
                            <div class="room-item">
                                <div class="room-info">
                                    <div class="room-id">房间ID: ${room.room_id}</div>
                                    <div class="room-players">玩家: ${room.players.join(', ') || '等待中'}</div>
                                </div>
                                <button class="join-btn" onclick="joinGame('${room.room_id}', '${getUsername()}')">加入</button>
                            </div>
                        `).join('');
                    } else {
                        roomsList.innerHTML = '<p style="text-align: center; color: #666;">暂无可用房间</p>';
                    }
                })
                .catch(error => {
                    console.error('获取房间列表失败:', error);
                    document.getElementById('roomsList').innerHTML = '<p style="text-align: center; color: #ff6b6b;">获取房间列表失败</p>';
                });
        }
        
        // 页面加载时获取房间列表
        window.addEventListener('load', () => {
            fetchRooms();
            // 每5秒刷新一次房间列表
            setInterval(fetchRooms, 5000);
        });
    </script>
</body>
</html>
