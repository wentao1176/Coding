<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏 - 宣文韬</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            animation: fadeInUp 0.6s ease-out;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .title {
            font-size: 2.5rem;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            font-size: 1.1rem;
        }
        .game-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px 20px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 15px;
            border: 1px solid rgba(102, 126, 234, 0.2);
        }
        .control-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .control-label {
            font-weight: 600;
            color: #333;
            font-size: 0.9rem;
        }
        .control-value {
            font-size: 1.5rem;
            font-weight: 900;
            color: #667eea;
        }
        .control-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .difficulty-btn {
            padding: 8px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 20px;
            background: white;
            color: #333;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .difficulty-btn:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }
        .difficulty-btn.active {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border-color: #667eea;
        }
        .select-message {
            text-align: center;
            margin: 30px 0;
            padding: 20px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 15px;
            border: 1px solid rgba(102, 126, 234, 0.2);
            color: #666;
            font-size: 1.1rem;
        }
        .instructions {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            border: 1px solid rgba(102, 126, 234, 0.3);
        }
        .instructions h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1rem;
        }
        .instructions p {
            color: #666;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: color 0.3s ease;
        }
        .back-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            .title {
                font-size: 2rem;
            }
            .game-controls {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            .control-item, .control-group {
                justify-content: center;
            }

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">贪吃蛇游戏</h1>
            <p class="subtitle">使用方向键控制蛇的移动</p>
        </div>
        
        <div class="select-message">
            <p>请选择游戏难度开始游戏</p>
        </div>
        
        <div class="instructions">
            <h3>游戏说明</h3>
            <p>电脑端：使用方向键（↑↓←→）或 WASD 键控制蛇的移动方向<br>
            手机端：使用左下角的虚拟摇杆控制方向<br>
            吃到食物加分并增长身体。撞到墙壁或自己的身体游戏结束。</p>
        </div>
        
        <div class="back-link">
            <a href="index.html">返回主页</a>
        </div>
    </div>

    <script>
        // 跳转到全屏游戏
        function startFullscreenGame(level) {
            window.location.href = `snake-full.html?level=${level}`;
        }
    </script>
</body>
</html>
