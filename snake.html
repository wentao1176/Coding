<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏 - 宣文韬</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            animation: fadeInUp 0.6s ease-out;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .title {
            font-size: 2.5rem;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            font-size: 1.1rem;
        }
        .game-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px 20px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 15px;
            border: 1px solid rgba(102, 126, 234, 0.2);
        }
        .control-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .control-label {
            font-weight: 600;
            color: #333;
            font-size: 0.9rem;
        }
        .control-value {
            font-size: 1.5rem;
            font-weight: 900;
            color: #667eea;
        }
        .control-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .difficulty-btn {
            padding: 8px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 20px;
            background: white;
            color: #333;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .difficulty-btn:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }
        .difficulty-btn.active {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border-color: #667eea;
        }
        .reset-btn {
            padding: 10px 20px;
            background: linear-gradient(45deg, #f06292, #ec407a);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(240, 98, 146, 0.3);
        }
        .game-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .game-board {
            border: 3px solid #d0d0d0;
            border-radius: 10px;
            background: #f0f0f0;
            position: relative;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(20, 25px);
            grid-template-rows: repeat(20, 25px);
        }
        .cell {
            width: 25px;
            height: 25px;
            border: 1px solid rgba(200, 200, 200, 0.3);
        }
        .cell.snake {
            background: linear-gradient(45deg, #4caf50, #45a049);
            border-color: #2e7d32;
        }
        .cell.food {
            background: linear-gradient(45deg, #f44336, #d32f2f);
            border-radius: 50%;
            border-color: #b71c1c;
        }
        .cell.snake-head {
            background: linear-gradient(45deg, #2e7d32, #1b5e20);
            border-radius: 50%;
        }
        .game-status {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            display: none;
        }
        .game-status.win {
            background: #e8f5e8;
            color: #2e7d32;
            border: 2px solid #4caf50;
        }
        .game-status.lose {
            background: #ffebee;
            color: #c62828;
            border: 2px solid #f44336;
        }
        .instructions {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            border: 1px solid rgba(102, 126, 234, 0.3);
        }
        .instructions h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1rem;
        }
        .instructions p {
            color: #666;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: color 0.3s ease;
        }
        .back-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            .title {
                font-size: 2rem;
            }
            .game-controls {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            .control-item, .control-group {
                justify-content: center;
            }
            .game-grid {
                grid-template-columns: repeat(20, 20px);
                grid-template-rows: repeat(20, 20px);
            }
            .cell {
                width: 20px;
                height: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">贪吃蛇游戏</h1>
            <p class="subtitle">使用方向键控制蛇的移动</p>
        </div>
        
        <div class="game-controls">
            <div class="control-item">
                <span class="control-label">分数:</span>
                <span class="control-value" id="score">0</span>
            </div>
            <div class="control-group">
                <button class="difficulty-btn active" data-speed="150">简单</button>
                <button class="difficulty-btn" data-speed="100">中等</button>
                <button class="difficulty-btn" data-speed="70">困难</button>
            </div>
            <button class="reset-btn" onclick="resetGame()">重新开始</button>
        </div>
        
        <div class="game-container">
            <div class="game-board">
                <div class="game-grid" id="game-grid"></div>
            </div>
        </div>
        
        <div class="game-status" id="game-status"></div>
        
        <div class="instructions">
            <h3>游戏说明</h3>
            <p>使用方向键（↑↓←→）控制蛇的移动方向，吃到食物加分并增长身体。撞到墙壁或自己的身体游戏结束。</p>
        </div>
        
        <div class="back-link">
            <a href="index.html">返回主页</a>
        </div>
    </div>

    <script>
        let game = null;
        let gameInterval = null;
        let currentSpeed = 150;
        
        class SnakeGame {
            constructor() {
                this.gridSize = 20;
                this.cellSize = 25;
                this.snake = [{ x: 10, y: 10 }];
                this.direction = 'right';
                this.food = this.generateFood();
                this.score = 0;
                this.gameOver = false;
                
                this.initGame();
                this.render();
            }
            
            initGame() {
                const grid = document.getElementById('game-grid');
                grid.innerHTML = '';
                
                for (let y = 0; y < this.gridSize; y++) {
                    for (let x = 0; x < this.gridSize; x++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.dataset.x = x;
                        cell.dataset.y = y;
                        grid.appendChild(cell);
                    }
                }
                
                document.getElementById('score').textContent = '0';
                document.getElementById('game-status').style.display = 'none';
            }
            
            generateFood() {
                let food;
                do {
                    food = {
                        x: Math.floor(Math.random() * this.gridSize),
                        y: Math.floor(Math.random() * this.gridSize)
                    };
                } while (this.snake.some(segment => segment.x === food.x && segment.y === food.y));
                
                return food;
            }
            
            move() {
                const head = { ...this.snake[0] };
                
                switch (this.direction) {
                    case 'up':
                        head.y--;
                        break;
                    case 'down':
                        head.y++;
                        break;
                    case 'left':
                        head.x--;
                        break;
                    case 'right':
                        head.x++;
                        break;
                }
                
                // 检查碰撞
                if (this.checkCollision(head)) {
                    this.gameOver = true;
                    this.gameOverHandler();
                    return;
                }
                
                this.snake.unshift(head);
                
                // 检查是否吃到食物
                if (head.x === this.food.x && head.y === this.food.y) {
                    this.score += 10;
                    document.getElementById('score').textContent = this.score;
                    this.food = this.generateFood();
                } else {
                    this.snake.pop();
                }
                
                this.render();
            }
            
            checkCollision(head) {
                // 检查边界
                if (head.x < 0 || head.x >= this.gridSize || head.y < 0 || head.y >= this.gridSize) {
                    return true;
                }
                
                // 检查自身碰撞
                for (let i = 1; i < this.snake.length; i++) {
                    if (head.x === this.snake[i].x && head.y === this.snake[i].y) {
                        return true;
                    }
                }
                
                return false;
            }
            
            render() {
                // 清除所有单元格
                document.querySelectorAll('.cell').forEach(cell => {
                    cell.className = 'cell';
                });
                
                // 绘制蛇
                this.snake.forEach((segment, index) => {
                    const cell = document.querySelector(`[data-x="${segment.x}"][data-y="${segment.y}"]`);
                    if (cell) {
                        cell.className = index === 0 ? 'cell snake snake-head' : 'cell snake';
                    }
                });
                
                // 绘制食物
                const foodCell = document.querySelector(`[data-x="${this.food.x}"][data-y="${this.food.y}"]`);
                if (foodCell) {
                    foodCell.className = 'cell food';
                }
            }
            
            changeDirection(newDirection) {
                const oppositeDirections = {
                    'up': 'down',
                    'down': 'up',
                    'left': 'right',
                    'right': 'left'
                };
                
                if (newDirection !== oppositeDirections[this.direction]) {
                    this.direction = newDirection;
                }
            }
            
            gameOverHandler() {
                stopGame();
                const statusElement = document.getElementById('game-status');
                statusElement.textContent = `游戏结束！最终得分：${this.score}`;
                statusElement.className = 'game-status lose';
                statusElement.style.display = 'block';
            }
        }
        
        function startGame() {
            stopGame();
            game = new SnakeGame();
            gameInterval = setInterval(() => {
                if (game && !game.gameOver) {
                    game.move();
                }
            }, currentSpeed);
        }
        
        function stopGame() {
            if (gameInterval) {
                clearInterval(gameInterval);
                gameInterval = null;
            }
        }
        
        function resetGame() {
            startGame();
        }
        
        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (!game || game.gameOver) return;
            
            switch (e.key) {
                case 'ArrowUp':
                    e.preventDefault();
                    game.changeDirection('up');
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    game.changeDirection('down');
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    game.changeDirection('left');
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    game.changeDirection('right');
                    break;
            }
        });
        
        // 难度选择
        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentSpeed = parseInt(this.dataset.speed);
                if (game) {
                    stopGame();
                    startGame();
                }
            });
        });
        
        // 页面加载时开始游戏
        window.addEventListener('load', () => {
            startGame();
        });
    </script>
</body>
</html>
