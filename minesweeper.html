<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扫雷游戏 - 宣文韬</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            animation: fadeInUp 0.6s ease-out;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .title {
            font-size: 2.5rem;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            font-size: 1.1rem;
        }
        .game-settings {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .difficulty-btn {
            padding: 12px 24px;
            border: 2px solid #e1e5e9;
            border-radius: 25px;
            background: white;
            color: #333;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .difficulty-btn:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }
        .difficulty-btn.active {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border-color: #667eea;
        }
        .select-message {
            text-align: center;
            margin: 30px 0;
            padding: 20px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 15px;
            border: 1px solid rgba(102, 126, 234, 0.2);
            color: #666;
            font-size: 1.1rem;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: color 0.3s ease;
        }
        .back-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            .title {
                font-size: 2rem;
            }
            .cell {
                width: 25px;
                height: 25px;
                font-size: 12px;
            }
            .game-controls {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            .control-item {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">扫雷游戏</h1>
            <p class="subtitle">选择难度开始游戏</p>
        </div>
        
        <div class="game-settings">
            <button class="difficulty-btn" onclick="startFullscreenGame('easy')">初级 (9×9, 10雷)</button>
            <button class="difficulty-btn" onclick="startFullscreenGame('medium')">中级 (16×16, 40雷)</button>
            <button class="difficulty-btn" onclick="startFullscreenGame('hard')">高级 (16×30, 99雷)</button>
        </div>
        
        <div class="select-message">
            <p>请选择游戏难度开始游戏</p>
        </div>
        
        <div class="back-link">
            <a href="index.html">返回主页</a>
        </div>
    </div>

    <script>
        // 跳转到全屏游戏
        function startFullscreenGame(level) {
            window.location.href = `minesweeper-full.html?level=${level}`;
        }
    </script>
</body>
</html>
