name: Sync Users Data

on:
  schedule:
    # 每小时同步一次
    - cron: '0 * * * *'
  # 也可以手动触发
  workflow_dispatch:

jobs:
  sync-users:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch users data from Vercel API
        run: |
          # 使用用户提供的Vercel域名
          VERCEL_URL="https://xwt.vercel.app"
          curl -s "$VERCEL_URL/api/users" > users.json
          cat users.json

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add users.json
          # 只有当文件有变化时才提交
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync users data $(date -u)"
            git push
          fi
